        <h1>MPS Group - Heavy-Oil Surface Facilities and Fabrication</h1>
        <p>
          MPS Group operates from Pierceland, Saskatchewan, serving Saskatchewan and Alberta heavy oil and SAGD operators.
          Services include surface-facility fabrication, piping and pipe supports, structural fabrication, welding,
          machining and repair, execution and turnover support, and WellFi downhole technology.
        </p>
        <ul>
          <li>Surface facilities: SAGD and heavy-oil plant modifications, pump packages, PSV discharge work, and re-rate projects.</li>
          <li>Piping and supports: spools, shoes, clamps, racks, and B31.3 code-compliant execution.</li>
          <li>Structural fabrication: skids, supports, and plant packages built from drawings and specifications.</li>
          <li>Welding: certified SMAW, GMAW, FCAW, and GTAW welding services.</li>
          <li>WellFi: the first public MPS downhole technology product and the base for future sand-control and flow-control development.</li>
        </ul>
        <p>Phone: (780) 594-8100. Address: E Range Rd 3264, Highway 55, Pierceland, SK S0M 2K0.</p>
